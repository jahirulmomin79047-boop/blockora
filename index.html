<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Blockora - Casual Block Puzzle</title>
  
  <!-- PWA & Mobile Web Meta -->
  <meta name="description" content="Play Blockora, the premium casual block puzzle game with satisfying blasts, combos, and relaxing music.">
  <meta name="theme-color" content="#0c1026">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blockora">

  <!-- Manifest & Favicon (Relative Paths for Netlify) -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="app-container">
    <!-- Particle Effects Layer -->
    <canvas id="particle-canvas"></canvas>

    <!-- Header -->
    <header>
      <div class="brand-badge">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="2" width="9" height="9" rx="2.5" fill="#00E5FF" />
          <rect x="13" y="2" width="9" height="9" rx="2.5" fill="#FF2A85" />
          <rect x="2" y="13" width="9" height="9" rx="2.5" fill="#FFD200" />
          <rect x="13" y="13" width="9" height="9" rx="2.5" fill="#7C4DFF" />
        </svg>
        <span class="brand-title">BLOCKORA</span>
      </div>

      <div class="header-actions">
        <!-- Sound FX Toggle -->
        <button id="sound-toggle-btn" class="icon-btn" title="Toggle Sound FX" aria-label="Toggle Sound FX">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>

        <!-- Music Toggle -->
        <button id="music-toggle-btn" class="icon-btn" title="Toggle Music" aria-label="Toggle Music">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
          </svg>
        </button>

        <!-- Restart Button -->
        <button id="restart-btn" class="icon-btn" title="Restart Game" aria-label="Restart Game">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Stats Dashboard (Exactly TWO Displays: SCORE and HIGH SCORE) -->
    <div class="stats-container">
      <!-- Main Current Score -->
      <div class="stat-card main-score">
        <span class="stat-label">SCORE</span>
        <span id="score-val" class="stat-val">0</span>
      </div>

      <!-- Saved High Score -->
      <div class="stat-card">
        <span class="stat-label gold">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
          </svg>
          HIGH SCORE
        </span>
        <span id="high-score-val" class="stat-val">0</span>
      </div>
    </div>

    <!-- 8x8 Board -->
    <div class="board-wrapper">
      <div id="board" class="board-grid"></div>
    </div>

    <!-- Bottom Piece Tray (3 Slots) -->
    <div class="piece-tray">
      <div id="slot-0" class="piece-slot"></div>
      <div id="slot-1" class="piece-slot"></div>
      <div id="slot-2" class="piece-slot"></div>
    </div>

    <!-- Combo / Blast Toast -->
    <div id="combo-banner" class="combo-banner">COMBO x2!</div>

    <!-- Floating Drag Proxy Element -->
    <div id="drag-proxy" class="drag-proxy"></div>

    <!-- Game Over Modal Screen -->
    <div id="game-over-modal" class="modal-overlay">
      <div class="modal-card">
        <div class="badge-no-moves">NO MOVES LEFT</div>
        <h2 class="modal-title">GAME OVER</h2>

        <div class="final-score-box">
          <div class="final-score-label">FINAL SCORE</div>
          <div id="final-score-val" class="final-score-num">0</div>
        </div>

        <div class="modal-stats">
          <div class="modal-stat-box" style="grid-column: span 2;">
            <div class="modal-stat-title">HIGH SCORE</div>
            <div id="modal-high-score-val" class="modal-stat-val">0</div>
          </div>
        </div>

        <button id="play-again-btn" class="play-again-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          PLAY AGAIN
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="./audio.js"></script>
  <script src="./app.js"></script>
</body>
</html>
